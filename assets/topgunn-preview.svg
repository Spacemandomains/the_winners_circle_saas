  <rect x='930' y='590' width='260' height='240' rx='2' fill='#201f20' stroke='#f26500' stroke-width='1' />
  <text x='950' y='630' font-family='Inter, sans-serif' font-size='22' font-weight='800' fill='#ffb693'>Perplexity</text>
  <text x='950' y='655' font-family='Inter, sans-serif' font-size='10' fill='#929090'>Freshness &amp; Footnotes.</text>
